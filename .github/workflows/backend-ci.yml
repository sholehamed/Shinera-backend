name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend-shinera.slnx

      - name: Build (Release)
        run: dotnet build backend-shinera.slnx -c Release --no-restore

      - name: Identity foundation unit tests
        run: dotnet test tests/Shinera.Identity.Tests/Shinera.Identity.Tests.csproj -c Release --no-build --logger 'trx;LogFileName=identity-tests.trx' --results-directory TestResults

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 7
