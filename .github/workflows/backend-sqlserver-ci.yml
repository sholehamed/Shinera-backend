name: Backend SQL Server authorization tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlserver-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'ShineraSqlCi_Disposable_2026!'
          MSSQL_PID: Developer
          MSSQL_MEMORY_LIMIT_MB: '1600'
        ports:
          - 1433:1433
    env:
      SHINERA_SQLSERVER_TEST_CONNECTION: 'Server=127.0.0.1,1433;Database=master;User Id=sa;Password=ShineraSqlCi_Disposable_2026!;Encrypt=False;TrustServerCertificate=True;Connect Timeout=30'
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore SQL Server test project
        run: dotnet restore tests/Shinera.Identity.SqlServerTests/Shinera.Identity.SqlServerTests.csproj

      - name: Run SQL Server migrations and authorization regressions
        run: dotnet test tests/Shinera.Identity.SqlServerTests/Shinera.Identity.SqlServerTests.csproj -c Release --no-restore --logger 'trx;LogFileName=identity-sqlserver.trx' --results-directory TestResults

      - name: Real API startup and development admin login smoke
        env:
          ASPNETCORE_ENVIRONMENT: Development
          Identity__AllowInsecureHttpForE2E: 'true'
          Identity__E2E__Enabled: 'true'
          Identity__E2E__CaptchaCode: 'ABCDE'
          # Only the disposable Development CI database receives bootstrap grants.
          Identity__PlatformPermissions__EnforceRoleEndpoints: 'true'
          Identity__PlatformPermissions__EnforcePermissionEndpoints: 'true'
          Identity__PlatformPermissions__BootstrapDevelopmentGrants: 'true'
          SHINERA_DEVELOPMENT_ADMIN_PASSWORD: 'Disposable_Only_WriteScope_CI_2026!'
          DataBaseServer: '127.0.0.1,1433'
          DataBaseUsername: sa
          DataBasePassword: 'ShineraSqlCi_Disposable_2026!'
          Cors: 'http://127.0.0.1:4200'
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project src/Web/Web.csproj --no-launch-profile --urls http://127.0.0.1:5069 > /tmp/shinera-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for i in $(seq 1 75); do
            if curl --silent --fail --max-time 3 'http://127.0.0.1:5069/api/system/Auth/captcha/new' > /tmp/shinera-captcha.json; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/shinera-api.log
            exit 1
          fi

          token=$(python3 -c 'import json;print(json.load(open("/tmp/shinera-captcha.json"))["token"])')
          status=$(curl --silent --show-error --output /tmp/shinera-login.json --write-out '%{http_code}' \
            --request POST 'http://127.0.0.1:5069/api/system/Auth/login' \
            --data-urlencode grant_type=password \
            --data-urlencode client_id=postman \
            --data-urlencode username=admin \
            --data-urlencode password='Disposable_Only_WriteScope_CI_2026!' \
            --data-urlencode login_context=system \
            --data-urlencode scope='openid profile email api offline_access' \
            --data-urlencode "captchaid=$token" \
            --data-urlencode userEnteredCaptchaCode=ABCDE)
          if [ "$status" != 200 ]; then
            echo "Seeded admin token endpoint returned HTTP $status"
            cat /tmp/shinera-api.log
            exit 1
          fi
          access_token=$(python3 -c 'import json;print(json.load(open("/tmp/shinera-login.json"))["access_token"])')
          status=$(curl --silent --show-error --output /tmp/shinera-role-lookup.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $access_token" \
            'http://127.0.0.1:5069/api/system/Roles/lookup')
          if [ "$status" != 200 ]; then
            echo "Seeded admin cannot read the protected roles endpoint; HTTP $status"
            cat /tmp/shinera-api.log
            exit 1
          fi
          # Exercise the real HTTP -> CQRS -> trusted EF write path, not only
          # the isolated authorizer unit/integration tests.
          status=$(curl --silent --show-error --output /tmp/shinera-created-role.json \
            --write-out '%{http_code}' \
            --request POST 'http://127.0.0.1:5069/api/system/Roles' \
            --header "Authorization: Bearer $access_token" \
            --header 'Content-Type: application/json' \
            --data '{"name":"CI Platform Operator","description":"Scoped role smoke","isActive":true}')
          if [ "$status" != 201 ]; then
            echo "Verified System administrator could not create a scoped platform role (HTTP $status)"
            cat /tmp/shinera-created-role.json
            cat /tmp/shinera-api.log
            exit 1
          fi
          role_id=$(python3 -c 'import json;print(json.load(open("/tmp/shinera-created-role.json")))')
          if [ -z "$role_id" ]; then echo "Empty created role identifier"; exit 1; fi

          status=$(curl --silent --show-error --output /tmp/shinera-role-forbidden.json \
            --write-out '%{http_code}' \
            --request PUT 'http://127.0.0.1:5069/api/system/Roles/00000000-0000-0000-0000-000000000001/permissions' \
            --header "Authorization: Bearer $access_token" \
            --header 'Content-Type: application/json' \
            --data '{"permissionIds":[]}')
          if [ "$status" != 403 ]; then
            echo "Foreign/non-platform role write did not fail closed with 403 (HTTP $status)"
            cat /tmp/shinera-role-forbidden.json
            exit 1
          fi
          # Catalog keys are immutable through ordinary Permission CRUD even with
          # an authorized SuperAdmin and the optional granular policy enabled.
          status=$(curl --silent --show-error --output /tmp/shinera-catalog-forbidden.json \
            --write-out '%{http_code}' \
            --request POST 'http://127.0.0.1:5069/api/system/Permissions' \
            --header "Authorization: Bearer $access_token" \
            --header 'Content-Type: application/json' \
            --data '{"code":"ROLES.CREATE","name":"Attempted privilege overwrite","resourceId":"00000000-0000-0000-0000-000000000000","isActive":true,"permissionResources":[]}')
          if [ "$status" != 403 ]; then
            echo "Catalog mutation was not rejected with HTTP 403 (got $status)"
            cat /tmp/shinera-catalog-forbidden.json
            exit 1
          fi
          anonymous=$(curl --silent --show-error --output /tmp/shinera-anonymous-permission.json \
            --write-out '%{http_code}' \
            --request POST 'http://127.0.0.1:5069/api/system/Permissions' \
            --header 'Content-Type: application/json' \
            --data '{"code":"SERVICES.CREATE","name":"No access","permissionResources":[]}')
          if [ "$anonymous" != 401 ]; then
            echo "Anonymous Permission CRUD did not return 401 (got $anonymous)"
            exit 1
          fi
          echo "PASS: existing real System login and scoped Role smoke."
          # The API is still running in this shell step; its EXIT trap kills
          # the process afterwards. Do not move this into a later job step.
          # Uses only disposable Development/E2E seed identities, real
          # OpenIddict tokens and the same SQL Server container.
          python3 tests/http/platform_authorization_e2e.py || { tail -n 25 /tmp/shinera-api.log; exit 1; }

      - name: Upload SQL Server test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-sqlserver-test-results
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 7
